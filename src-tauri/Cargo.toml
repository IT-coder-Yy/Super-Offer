[package]
name = "super-offer"
version = "0.1.0"
description = "本地优先的求职工作台"
edition = "2024"
rust-version = "1.90"
license = "MIT"

[lib]
name = "super_offer"

[[bin]]
name = "super-offer"
path = "src/main.rs"
required-features = ["desktop"]

[features]
default = ["desktop"]
desktop = ["dep:tauri", "dep:tauri-plugin-dialog"]

[build-dependencies]
tauri-build = { version = "=2.7.4", features = ["config-toml"] }

[dependencies]
tauri = { version = "=2.12.5", optional = true, features = ["config-toml"] }
tauri-plugin-dialog = { version = "=2.8.4", optional = true }
rusqlite = { version = "=0.42.0", features = ["bundled", "backup"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
zip = { version = "=9.5.1", default-features = false, features = ["deflate"] }
tempfile = "=3.27.0"
keyring = "=4.2.0"
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls", "json", "multipart", "stream"] }
futures-util = "0.3"
eventsource-stream = "=0.2.3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
zeroize = "1"
